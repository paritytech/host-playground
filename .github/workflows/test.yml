name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests
        run: yarn test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # The suite signs in as the same people on live Paseo from every run, so two
    # at once race each other's nonces. Queue them instead, here and in
    # e2e-allocations.yml.
    concurrency:
      group: paseo-live-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: oven-sh/setup-bun@v2

      # The suite runs `yarn dev:paseo`, and the address is a static import.
      - name: Ensure SimpleStore is deployed
        working-directory: evm
        run: forge build && NETWORK=paseo-next-v2 bun scripts/ensure.ts

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: true
          # Lite people on paseo-next-v2, one 24-word mnemonic per line. Their
          # existing Bulletin claims pay for uploads; e2e-allocations.yml keeps
          # the claims current. Unset on forks, where those specs skip.
          E2E_PERSON_MNEMONICS: ${{ secrets.E2E_PERSON_MNEMONICS }}
          # Spread runs across the people, so one person's rate limits are not
          # spent by every run.
          E2E_PERSON_INDEX: ${{ github.run_number }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
