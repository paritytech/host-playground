name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip deployment cache and force redeploy"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.target.display-name }}
    # Deploying needs `secrets.MNEMONIC`, and GitHub withholds secrets from
    # pull requests opened from a fork. Skip rather than fail the check.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - env: preview
            display-name: Previewnet
            genesis: "0x4d11c803cc6921429e3876638977ad006ea1bba8cd3976a0bca2f164e7026210"
            suffix: .test
          - env: paseo-next-v2
            display-name: Paseo
            genesis: "0x23e730eb1c6fecae09c917439a5038cb6122d0d48980e8b9bbf0ff56f94a2ca6"
            suffix: .paseo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build for ${{ matrix.target.env }}
        env:
          NEXT_PUBLIC_NETWORK_GENESIS_HASH: ${{ matrix.target.genesis }}
        run: yarn build

      - name: Compute build hash
        id: hash
        run: echo "hash=$(find apps/app/out -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deployment cache
        id: cache
        if: inputs.skip-cache != true
        uses: actions/cache@v4
        with:
          path: .deploy-cache
          key: deploy-${{ matrix.target.env }}-${{ steps.hash.outputs.hash }}

      - name: Load cached CID
        id: cached-deploy
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cid=$(cat .deploy-cache/cid)" >> "$GITHUB_OUTPUT"
          echo "::notice::Found cached CID: $(cat .deploy-cache/cid)"

      - name: Setup IPFS Kubo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ipfs/download-ipfs-distribution-action@v1
        with:
          name: kubo
          version: v0.33.0

      - name: Initialize IPFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: ipfs init

      - name: Install bulletin-deploy
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install -g bulletin-deploy

      - name: Determine domain
        id: domain-input
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Two forms of the same name. `label` has no TLD and is what the
          # browser URL is built from. `dotns` carries this environment suffix,
          # which must match the registry current tld() because the CLI rejects
          # a stale one, and is what the CLI and the product manifest must both
          # name, spelled identically.
          #
          # Pull requests get a per-PR sandbox label. Keying it on the PR number
          # rather than the branch name keeps it stable across renames and force
          # pushes, and keeps the length fixed.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            LABEL="host-playground-pr${PR_NUMBER}-sandbox00"
          else
            LABEL="host-playground"
          fi
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "dotns=${LABEL}${{ matrix.target.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            export MNEMONIC='${{ secrets.MNEMONIC }}'
            export IPFS_CID='${{ steps.cached-deploy.outputs.cid }}'
            export NODE_OPTIONS='--max-old-space-size=8192'
            # The CLI compares the manifest's domain against this argument as
            # written, so both carry the suffix. A bare label deploys the
            # content and then fails the manifest publish on the mismatch.
            export MANIFEST_DOMAIN='${{ steps.domain-input.outputs.dotns }}'
            bulletin-deploy --env ${{ matrix.target.env }} 'apps/app/out' '${{ steps.domain-input.outputs.dotns }}'

      - name: Validate deployment outputs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "${{ steps.deploy.outputs.cid }}" ] || [ -z "${{ steps.deploy.outputs.domain }}" ]; then
            echo "::error::Deployment step completed but produced no CID or domain output."
            exit 1
          fi

      - name: Save deployment to cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .deploy-cache
          echo "${{ steps.deploy.outputs.cid }}" > .deploy-cache/cid

      - name: Persist deployment result
        run: |
          DOMAIN="${{ steps.domain-input.outputs.dotns }}"
          LABEL="${{ steps.domain-input.outputs.label }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            CID="${{ steps.cached-deploy.outputs.cid }}"
          else
            CID="${{ steps.deploy.outputs.cid }}"
          fi
          # Translate bulletin-deploy env id → dot.li network name (most match
          # 1:1; "preview" is the exception — dot.li knows it as "previewnet").
          case "${{ matrix.target.env }}" in
            preview) NETWORK="previewnet" ;;
            *) NETWORK="${{ matrix.target.env }}" ;;
          esac
          mkdir -p .deploy-result
          printf '{"env":"%s","network":"%s","domain":"%s","label":"%s","cid":"%s"}\n' \
            "${{ matrix.target.env }}" "$NETWORK" "$DOMAIN" "$LABEL" "$CID" \
            > .deploy-result/${{ matrix.target.env }}.json
          cat .deploy-result/${{ matrix.target.env }}.json

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        with:
          name: deploy-result-${{ matrix.target.env }}
          path: .deploy-result/${{ matrix.target.env }}.json

      - name: Deployment summary
        run: |
          DOMAIN=$(jq -r .domain .deploy-result/${{ matrix.target.env }}.json)
          LABEL=$(jq -r .label .deploy-result/${{ matrix.target.env }}.json)
          NETWORK=$(jq -r .network .deploy-result/${{ matrix.target.env }}.json)
          CID=$(jq -r .cid .deploy-result/${{ matrix.target.env }}.json)
          URL="https://${LABEL}.paseo.li?network=${NETWORK}&chainBackend=rpc-gateway"
          {
            echo "### ${DOMAIN} — ${{ matrix.target.env }}"
            echo ""
            echo "Browser &nbsp; ${URL}"
            echo "Desktop &nbsp; \`${DOMAIN}\`"
            echo "CID &nbsp; \`${CID}\`"
          } >> $GITHUB_STEP_SUMMARY

  comment:
    # Commenting needs a write token, which fork pull requests also don't get.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download deployment results
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-result-*
          path: deploy-results
          merge-multiple: true

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const dir = 'deploy-results';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            const results = files
              .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')))
              .sort((a, b) => a.env.localeCompare(b.env));

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const label = results[0]?.label ?? '(no domain)';

            const SHELL = { preview: 'testnet.li', 'paseo-next-v2': 'paseo.li' };
            const ENV_NAME = { preview: 'Previewnet', 'paseo-next-v2': 'Paseo' };

            const lines = [
              `**${label}** · [logs](${runUrl})`,
              '',
              '| Network | Desktop | Web |',
              '| :--- | :---: | :---: |',
            ];
            for (const { env, domain, label } of results) {
              const url = `https://${label}.${SHELL[env] ?? 'paseo.li'}`;
              lines.push(`| ${ENV_NAME[env] ?? env} | \`${domain}\` | ${url} |`);
            }

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('paseo.li')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
