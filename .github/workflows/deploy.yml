name: Deploy to DotNS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/

  deploy-production:
    if: github.event_name == 'push'
    needs: build
    uses: paritytech/dotns-sdk/.github/workflows/deploy.yml@main
    with:
      basename: test-product-sdk33
      mode: production
      artifact-name: web-dist
      register-base: true
    secrets:
      dotns-mnemonic: ${{ secrets.PASEO_DEPLOYER_MNEMONIC }}

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: build
    uses: paritytech/dotns-sdk/.github/workflows/deploy.yml@main
    with:
      basename: test-product-sdk33
      mode: preview
      subname-format: branch
      artifact-name: web-dist
      register-base: true
      max-retries: 5
    secrets:
      dotns-mnemonic: ${{ secrets.PASEO_DEPLOYER_MNEMONIC }}

  comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy-preview
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ needs.deploy-preview.outputs.url }}'
            const fqdn = '${{ needs.deploy-preview.outputs.fqdn }}'
            const cid = '${{ needs.deploy-preview.outputs.cid }}'

            const body = [
              '### Preview Deploy',
              '',
              `| | |`,
              `|---|---|`,
              `| **Preview** | [${fqdn}](${url}) |`,
              `| **CID** | \`${cid}\` |`,
              '',
              '_Deployed to Bulletin Chain via DotNS_',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Preview Deploy')
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
