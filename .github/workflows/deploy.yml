name: Deploy to DotNS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: "Skip deployment cache and force redeploy"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: parity-int-ubuntu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: out/

  deploy:
    needs: build
    runs-on: parity-int-ubuntu
    strategy:
      fail-fast: false
      matrix:
        env: [paseo-next-v2, preview]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: out

      - name: Compute build hash
        id: hash
        run: echo "hash=$(find out -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deployment cache
        id: cache
        if: inputs.skip-cache != true
        uses: actions/cache@v4
        with:
          path: .deploy-cache
          key: deploy-${{ matrix.env }}-${{ steps.hash.outputs.hash }}

      - name: Load cached CID
        id: cached-deploy
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cid=$(cat .deploy-cache/cid)" >> "$GITHUB_OUTPUT"
          echo "::notice::Found cached CID: $(cat .deploy-cache/cid)"

      - name: Setup IPFS Kubo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ipfs/download-ipfs-distribution-action@v1
        with:
          name: kubo
          version: v0.33.0

      - name: Initialize IPFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: ipfs init

      - name: Install bulletin-deploy
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install -g bulletin-deploy

      - name: Determine domain
        id: domain-input
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "dotns=host-playground.dot" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-' | sed 's/[^a-z0-9-]//g' | cut -c1-20)
            echo "dotns=${SAFE_BRANCH}-host-playground00.dot" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            export MNEMONIC='${{ secrets.MNEMONIC }}'
            export IPFS_CID='${{ steps.cached-deploy.outputs.cid }}'
            export NODE_OPTIONS='--max-old-space-size=8192'
            export MANIFEST_DOMAIN='${{ steps.domain-input.outputs.dotns }}'
            bulletin-deploy --env ${{ matrix.env }} 'out' '${{ steps.domain-input.outputs.dotns }}'

      - name: Validate deployment outputs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "${{ steps.deploy.outputs.cid }}" ] || [ -z "${{ steps.deploy.outputs.domain }}" ]; then
            echo "::error::Deployment step completed but produced no CID or domain output."
            exit 1
          fi

      - name: Save deployment to cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .deploy-cache
          echo "${{ steps.deploy.outputs.cid }}" > .deploy-cache/cid

      - name: Persist deployment result
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            DOMAIN="${{ steps.domain-input.outputs.dotns }}"
            DOMAIN="${DOMAIN%.dot}"
            CID="${{ steps.cached-deploy.outputs.cid }}"
          else
            DOMAIN="${{ steps.deploy.outputs.domain }}"
            CID="${{ steps.deploy.outputs.cid }}"
          fi
          # Translate bulletin-deploy env id → dot.li network name (most match
          # 1:1; "preview" is the exception — dot.li knows it as "previewnet").
          case "${{ matrix.env }}" in
            preview) NETWORK="previewnet" ;;
            *) NETWORK="${{ matrix.env }}" ;;
          esac
          mkdir -p .deploy-result
          printf '{"env":"%s","network":"%s","domain":"%s","cid":"%s"}\n' \
            "${{ matrix.env }}" "$NETWORK" "$DOMAIN" "$CID" \
            > .deploy-result/${{ matrix.env }}.json
          cat .deploy-result/${{ matrix.env }}.json

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        with:
          name: deploy-result-${{ matrix.env }}
          path: .deploy-result/${{ matrix.env }}.json

      - name: Deployment summary
        run: |
          DOMAIN=$(jq -r .domain .deploy-result/${{ matrix.env }}.json)
          NETWORK=$(jq -r .network .deploy-result/${{ matrix.env }}.json)
          CID=$(jq -r .cid .deploy-result/${{ matrix.env }}.json)
          URL="https://${DOMAIN}.paseo.li?network=${NETWORK}&chainBackend=rpc-gateway"
          {
            echo "### ${DOMAIN}.dot — ${{ matrix.env }}"
            echo ""
            echo "Browser &nbsp; ${URL}"
            echo "Desktop &nbsp; \`${DOMAIN}.dot\`"
            echo "CID &nbsp; \`${CID}\`"
          } >> $GITHUB_STEP_SUMMARY

  comment:
    if: github.event_name == 'pull_request'
    needs: deploy
    runs-on: parity-int-ubuntu
    permissions:
      pull-requests: write
    steps:
      - name: Download deployment results
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-result-*
          path: deploy-results
          merge-multiple: true

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const dir = 'deploy-results';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            const results = files
              .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')))
              .sort((a, b) => a.env.localeCompare(b.env));

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const dotns = results[0]?.domain ? `${results[0].domain}.dot` : '(no domain)';

            const lines = [
              `**${dotns}** · [logs](${runUrl})`,
              '',
            ];
            for (const { env, network, domain, cid } of results) {
              const url = `https://${domain}.paseo.li?network=${network}&chainBackend=rpc-gateway`;
              lines.push(`- \`${env}\` — ${url} &nbsp; · CID \`${cid}\``);
            }

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('paseo.li')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
