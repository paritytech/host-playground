version: 2
updates:
  # One PR a day carrying every @parity package update; merge-dependabot.yml
  # merges it once Tests passes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@parity/*"
    groups:
      parity:
        patterns:
          - "@parity/*"
    commit-message:
      prefix: chore
      include: scope
