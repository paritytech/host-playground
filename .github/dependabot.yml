version: 2
updates:
  # Daily, two grouped PRs: every @parity package (merged by
  # merge-dependabot.yml once Tests passes) and every other dependency.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      parity:
        patterns:
          - "@parity/*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "@parity/*"
    commit-message:
      prefix: chore
      include: scope
